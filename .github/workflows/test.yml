name: Offline source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python tools/check_publication.py
      - run: python -m unittest discover -s sdk/tests -v
      - run: python -m unittest discover -s models -p 'test_*.py' -v
      - run: PYTHONPATH=integrations/x5-ui python -m unittest discover -s integrations/x5-ui/tests -v
      - run: PYTHONPATH=tools/calibration python -m unittest discover -s tools/calibration -p 'test_*.py' -v
      - run: PYTHONPATH=experiments/ir-face:integrations/x5-ui python -m unittest discover -s experiments/ir-face/tests -v
      - run: python tools/calibration/timing_probe.py --self-test
      - run: python tools/calibration/read_factory.py --self-test
